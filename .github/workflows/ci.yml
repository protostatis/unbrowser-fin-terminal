name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repository to run
# typecheck/test/build. It has no secrets and never pushes or deploys.
permissions:
  contents: read

# Cancel stale runs for the same ref so a fast-following commit does not wait
# behind an obsolete CI job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node matches the Docker build/runtime image (node:22.23.2-bookworm-slim
      # in Dockerfile) so CI verifies the exact toolchain that ships.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci installs exactly the lockfile graph and runs the postinstall
      # security patch (scripts/patch-pi-brace-expansion.mjs), which replaces
      # the vulnerable nested pi-coding-agent brace-expansion with the pinned
      # 5.0.8 copy. tests/dependency-security.test.ts asserts the patched
      # runtime, so the test step below doubles as the patch guard.
      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated browser-terminal E2E
        run: npm run test:e2e:browser

      - name: Build
        run: npm run build

      - name: Build public-live runtime image
        run: |
          docker build \
            --build-arg PUBLIC_BASE_PATH=/fin-terminal-live-pilot/ \
            --build-arg VITE_TERMINAL_BUILD_MODE=public-live \
            --tag fin-terminal-ci:${GITHUB_SHA} \
            .

      - name: Build authenticated browser-terminal runtime image
        run: |
          docker build \
            --file Dockerfile.browser-terminal \
            --build-arg PUBLIC_BASE_PATH=/fin-terminal-browser/ \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag fin-terminal-browser-ci:${GITHUB_SHA} \
            .

      - name: Smoke test final research worker artifact
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' fin-terminal-ci:${GITHUB_SHA})"
          docker run --rm --network none --entrypoint node \
            "${image_id}" /app/server/research-worker-artifact-smoke.js

      - name: Smoke test authenticated browser backend without Pi imports
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' fin-terminal-browser-ci:${GITHUB_SHA})"
          docker run --rm --network none \
            --env NODE_ENV=production \
            --env HOST=127.0.0.1 \
            --env PORT=0 \
            --env PUBLIC_BASE_PATH=/fin-terminal-browser/ \
            --env TERMINAL_RUNTIME_MODE=browser \
            --env MARKET_PROXY_TOKEN=ci-proxy-token \
            --env OPENROUTER_API_KEY=ci-openrouter-key \
            --env UNBROWSER_MCP_URL=http://fin-terminal-browser-mcp:8767/mcp \
            --entrypoint sh "${image_id}" -c '
              set -eu
              node dist-server/server/browser-terminal-main.js >/tmp/browser-terminal.log 2>&1 &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              sleep 2
              if ! kill -0 "$pid" 2>/dev/null; then
                cat /tmp/browser-terminal.log
                exit 1
              fi
            '
